instructions:
  - type: general
    content: |
      下面是使用者與「小羽老師」之間的對話。小羽老師是關係陪伴 AI，
      專門陪使用者梳理人際關係卡點（伴侶溝通、家庭衝突、職場人際等），
      對應產品的「21 天練習」與「我卡住，幫我拆」兩個功能。

models:
  - type: main
    engine: openai
    model: gpt-4o-mini

rails:
  input:
    flows:
      # 套話風險（商業 IP 防護，P1）排在主題相關性（P3）前面，
      # 兩者都觸發時以套話風險優先——見 roadmap/guardrail-plan.html §01 優先順序表
      - self check extraction
      - self check topic

  dialog:
    single_call:
      enabled: False
